# CI for every pull request and push to main: typecheck, lint, unit + PostgreSQL
# tests, client/server/agent build, installer tests, shellcheck, theme tokens,
# and full Playwright E2E against a scratch database and fake crontab/fleet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PITASKER_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      SHELLCHECK_OPTS: -S warning

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Align npm version
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit and database tests
        run: npm test

      - name: Build client, server, and agent
        run: npm run build

      - name: Agent installer tests
        run: npm run test:install

      - name: Shellcheck
        run: npm run check:shell

      - name: Theme token check
        run: npm run check:theme

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PITASKER_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      SHELLCHECK_OPTS: -S warning

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Align npm version
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E suite
        run: npm run test:e2e
